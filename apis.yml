name: Web3 Foundation
description: 'Web3 Foundation is a Swiss nonprofit founded in 2017 by Gavin Wood
  that funds research and development teams building the foundation of a decentralized
  web (Web3). It stewards and supports the Polkadot and Kusama networks, operates a
  research hub and an education/wiki program, and historically ran the Web3 Foundation
  Grants Program (now discontinued) to seed open-source software and protocol research.
  It is a funding and research organization rather than a traditional API provider:
  it publishes no public REST/OpenAPI surface, but does maintain an RFC 9116 security.txt
  and a coordinated vulnerability-disclosure program.'
